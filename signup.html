<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Sign In</title>
  <link rel="shortcut icon" href="online.png" type="image/x-icon">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .card {
      background: #0a0a0a;
      border-radius: 18px;
      width: 280px;
      padding: 36px 28px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .card-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .card-header h1 {
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .card-header span {
      color: #1a6bff;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .fields {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .field {
      display: flex;
      align-items: flex-end;
      gap: 12px;
    }

    .field svg {
      flex-shrink: 0;
      margin-bottom: 4px;
    }

    .field-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .field-wrap label {
      color: #888;
      font-size: 10px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    .field-wrap input {
      background: transparent;
      border: none;
      border-bottom: 1.5px solid #fff;
      outline: none;
      color: #fff;
      font-size: 14px;
      padding: 4px 0;
      caret-color: #1a6bff;
      width: 100%;
    }

    .btn {
      background: #e0e0e0;
      color: #111;
      border: none;
      border-radius: ;
      padding: 10px 36px;
      font-size: 13px;
      font-weight: lighter;

    }

    .btn:hover {
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <span>Student Portal</span>
      <h1>Sign In</h1>
    </div>

    <div class="fields">
      <!-- Student Name -->
      <div class="field">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#1a6bff" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 12C14.7614 12 17 9.76142 17 7C17 4.23858 14.7614 2 12 2C9.23858 2 7 4.23858 7 7C7 9.76142 9.23858 12 12 12Z"/>
          <path d="M12 14C7.58172 14 4 16.6863 4 20V22H20V20C20 16.6863 16.4183 14 12 14Z"/>
        </svg>
        <div class="field-wrap">
          <label for="student-name">Student Name</label>
          <input type="text" id="student-name" autocomplete="name" placeholder=" " />
        </div>
      </div>

      <!-- Roll Number -->
      <div class="field">
        <!-- Graduation cap icon -->
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#1a6bff" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3L1 9L12 15L21 10.09V17H23V9L12 3Z"/>
          <path d="M5 13.18V17.18L12 21L19 17.18V13.18L12 17L5 13.18Z"/>
        </svg>
        <div class="field-wrap">
          <label for="roll-number">Roll Number</label>
          <input type="text" id="roll-number" autocomplete="off" placeholder=" " />
        </div>
      </div>

      <!-- Password -->
      <div class="field">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#1a6bff" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4" fill="none" stroke="#1a6bff" stroke-width="2"/>
        </svg>
        <div class="field-wrap">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" placeholder=" " />
        </div>
      </div>
    </div>

    <button class="btn" type="button">Sign In</button>
  </div>
</body>
</html>
