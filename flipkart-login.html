<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flipkart Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background-color: #f1f3f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    .modal {
      display: flex;
      width: 750px;
      min-height: 480px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.18);
      border-radius: 4px;
      overflow: hidden;
      background: #fff;
    }

   
    .left-panel {
      background: #2874f0;
      width: 280px;
      flex-shrink: 0;
      padding: 40px 28px 0 28px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .left-panel h1 {
      color: #fff;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .left-panel p {
      color: rgba(255, 255, 255, 0.85);
      font-size: 16px;
      line-height: 1.55;
    }

    .illustration {
      margin-top: auto;
      position: relative;
      height: 220px;
    }

    .arc {
      width: 230px;
      height: 115px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 115px 115px 0 0;
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    .box-red {
      width: 48px;
      height: 56px;
      background: #e53935;
      border-radius: 4px;
      position: absolute;
      bottom: 28px;
      left: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .heart {
      color: #fff;
      font-size: 18px;
    }

    .box-red::before {
      content: '';
      position: absolute;
      top: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 14px;
      background: #fff;
      border-radius: 2px;
    }

    .f-logo {
      color: #2874f0;
      font-size: 22px;
      font-weight: 900;
      font-style: italic;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      border: none;
      border-bottom: 1px solid #c2c2c2;
      outline: none;
      font-size: 16px;
      padding: 10px 0;
      color: #333;
      background: transparent;
      transition: border-color 0.2s;
    }

    .input-group input::placeholder {
      color: #999;
    }

    .input-group input:focus {
      border-bottom-color: #2874f0;
    }

    .terms {
      font-size: 12.5px;
      color: #666;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .terms a {
      color: #2874f0;
      text-decoration: none;
    }

    .terms a:hover {
      text-decoration: underline;
    }

    .btn-otp {
      width: 100%;
      padding: 14px;
      background: #fb641b;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-otp:hover {
      background: #e05510;
    }

    .create-account {
      margin-top: auto;
      text-align: center;
    }

    .create-account a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="modal">

  
    <div class="left-panel">
      <h1>Login</h1>
      <p>Get access to your Orders, Wishlist and Recommendations</p>

      <div class="illustration">
        
        <div class="sun"></div>

       
        <div class="cloud">
          <div class="cloud-body"></div>
        </div>

       
        <div class="arc"></div>

       
        <div class="box-red">
          <span class="heart">♥</span>
        </div>

     
        <div class="laptop-base">
          <div class="laptop-screen">
            <div class="user-icon"></div>
          </div>
        </div>
        <div class="laptop-stand"></div>

       
        <div class="box-yellow">
          <span class="f-logo">f</span>
        </div>
      </div>
    </div>

 
    <div class="right-panel">
      <div class="input-group">
        <input type="text" placeholder="Enter Email/Mobile number" />
      </div>

      <p class="terms">
        By continuing, you agree to Flipkart's
        <a href="#">Terms of Use</a> and
        <a href="#">Privacy Policy</a>.
      </p>

      <button class="btn-otp">Request OTP</button>

      <div class="create-account">
        <a href="#">New to Flipkart? Create an account</a>
      </div>
    </div>

  </div>
</body>

</html>
