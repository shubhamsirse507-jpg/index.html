<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        body {
            background-color: #D6F2FC;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .box {
            background-color: #D6F2FC;
            width: 500px;
            padding: 30px;
            border: 1px solid #aacfde;
            border-radius: 10px;
            box-shadow: 5px 5px 15px gray;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .profile img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile h2 {
            margin: 0;
            font-size: 22px;
        }

        .profile h3 {
            margin: 5px 0;
            font-weight: normal;
            color: gray;
        }

        .profile p {
            margin: 0;
            font-size: 14px;
            color: #333;
        }

        .stats {
            display: flex;
            gap: 40px;
        }

        .stats h2 {
            margin: 0;
            font-size: 20px;
        }

        .stats p {
            margin: 5px 0 0 0;
            font-size: 13px;
            color: gray;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="profile">
            <img src="https://external-content.duckduckgo.com/iu/?u=https%3A%2F%2Ftse1.mm.bing.net%2Fth%2Fid%2FOIP.yh61QP4VdS2SvdBj3ROQXgHaKe%3Fpid%3DApi&f=1&ipt=b575b843a2a04ed7d885f5135b2594bdb152bb2937ed776176fd51bd0cf0ebc4&ipo=images"
                alt="Profile photo">
            <div>
                <h2>Shubham Sirse</h2>
                <h3>@Shubham_sirse</h3>
                <p>I am a Front end Developer, follow me to be the first who sees my work.</p>
            </div>
        </div>

        <div class="stats">
            <div>
                <h2>15k</h2>
                <p>Views</p>
            </div>
            <div>
                <h2>2</h2>
                <p>Projects</p>
            </div>
            <div>
                <h2>1.3M</h2>
                <p>Followers</p>
            </div>
        </div>
        <button style="color: white; background: #000;">follow</button>
        <button style="color: white; background: #000;">View Profile</button>
    </div>

</body>

</html>
