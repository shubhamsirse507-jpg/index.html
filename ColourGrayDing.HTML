<!DOCTYPE html>
<html lang="en">
<title>ColourGrayDing</title>
<link rel="shortcut icon" href="color-wheel.png" type="image/x-icon">

<head>
    <style>
        .circle {
            width: 150px;
            height: 150px;
            background: conic-gradient(lightblue 0deg 45deg,
                    red 45deg 90deg,
                    green 90deg 135deg,
                    darkblue 135deg 180deg,
                    orange 180deg 225deg,
                    yellow 225deg 270deg,
                    black 270deg 315deg,
                    lightpink 315deg 360deg);
            border-radius: 50%;
            margin: auto;
            margin-top: 250px;
        }
    </style>
</head>

<body>
    <div class="circle"></div>
</body>

</html>
