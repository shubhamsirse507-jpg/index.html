<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background: conic-gradient(black,white,);
}


nav{
    height: 100px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:linear-gradient(orange,red,yellow);
    padding:15px 50px;
    /*border-radius: 10%;*/
}

.logo{
    color:white;
    font-size:28px;
    font-weight:bold;
}


ul{
    display:flex;
    list-style:none;
    gap:30px;
}

ul li a{
    text-decoration:none;
    color:white;
    font-size:18px;
    padding:8px 15px;
    transition:0.3s;
}

ul li a:hover{
    background:#ff9800;
    border-radius:5px;
}

</style>
</head>

<body>

<nav>
    <div class="logo">Shubham</div>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Gallery</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>

</body>
</html>
